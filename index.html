<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  var stage=document.getElementById('stage'),load=document.getElementById('load');
  if(!window.PointerEvent){load.textContent='Please update your phone browser to view the 3D model.';return;}
  if(typeof THREE==='undefined'){load.textContent='Please connect to the internet to view the 3D model.';return;}
  if(!matchMedia('(pointer: coarse)').matches){document.getElementById('hint').innerHTML='<span>Drag to rotate</span><span>Scroll to zoom</span><span>Double-click to reset</span>';}
  var bin=atob(document.getElementById('stl-data').textContent.trim()),buf=new ArrayBuffer(bin.length),u8=new Uint8Array(buf);
  for(var i=0;i<bin.length;i++)u8[i]=bin.charCodeAt(i);
  var dv=new DataView(buf),n=dv.getUint32(80,true),pos=new Float32Array(n*9);
  for(var t=0;t<n;t++){var o=84+t*50;for(var v=0;v<3;v++){var p=o+12+v*12,k=t*9+v*3;pos[k]=dv.getFloat32(p,true);pos[k+1]=dv.getFloat32(p+8,true);pos[k+2]=-dv.getFloat32(p+4,true);}}
  var geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));geo.computeVertexNormals();
  geo.computeBoundingBox();var c=new THREE.Vector3();geo.boundingBox.getCenter(c);geo.translate(-c.x,-c.y,-c.z);geo.computeBoundingSphere();var R=geo.boundingSphere.radius;
  var scene=new THREE.Scene(),cam=new THREE.PerspectiveCamera(32,1,0.1,1000);
  var ren;try{ren=new THREE.WebGLRenderer({antialias:true,alpha:true});}catch(err){load.textContent='This browser cannot show 3D. Try opening the link in Safari or Chrome.';return;}ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.outputEncoding=THREE.sRGBEncoding;
  stage.appendChild(ren.domElement);load.remove();
  scene.add(new THREE.HemisphereLight(0xffffff,0x8aa0b0,1.0));
  var l1=new THREE.DirectionalLight(0xffffff,0.9);l1.position.set(1,1.4,1.2);scene.add(l1);
  var l2=new THREE.DirectionalLight(0xbfe6ff,0.55);l2.position.set(-1.2,0.4,-1);scene.add(l2);
  var l3=new THREE.DirectionalLight(0xffffff,0.3);l3.position.set(-1,-1,1);scene.add(l3);
  scene.add(new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:new THREE.Color(0x003359).convertSRGBToLinear(),roughness:0.38,metalness:0.05})));
  function homeDist(){var v=32*Math.PI/180,h=2*Math.atan(Math.tan(v/2)*innerWidth/innerHeight);return R/Math.sin(Math.min(v,h)/2)*0.9;}
  var HOME={az:0.45,el:0.32},az=HOME.az,el=HOME.el,dist=homeDist(),target=new THREE.Vector3(),spin=true;
  var hint=document.getElementById('hint'),idle=null;function setSpin(s){spin=s;if(!s){hint.classList.add('faded');clearTimeout(idle);idle=setTimeout(function(){setSpin(true);hint.classList.remove('faded');},8000);}}
  function clampD(){dist=Math.max(R*1.6,Math.min(R*10,dist));}
  function size(){var w=innerWidth,h=innerHeight;ren.setSize(w,h,false);cam.aspect=w/h;cam.updateProjectionMatrix();}
  size();addEventListener('resize',size);
  function pan(dx,dy){var s=dist*Math.tan(cam.fov*Math.PI/360)*2/innerHeight;var r=new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld,0),u=new THREE.Vector3().setFromMatrixColumn(cam.matrixWorld,1);target.addScaledVector(r,-dx*s).addScaledVector(u,dy*s);}
  var pts={},mode=null,last=null;
  function two(){var k=Object.keys(pts);var a=pts[k[0]],b=pts[k[1]];return{d:Math.hypot(a.x-b.x,a.y-b.y),x:(a.x+b.x)/2,y:(a.y+b.y)/2};}
  stage.addEventListener('contextmenu',function(e){e.preventDefault();});
  stage.addEventListener('pointerdown',function(e){
    try{stage.setPointerCapture(e.pointerId);}catch(_){}pts[e.pointerId]={x:e.clientX,y:e.clientY};setSpin(false);
    var cnt=Object.keys(pts).length;
    if(cnt===2){mode='touch2';last=two();}
    else if(cnt===1){mode=(e.pointerType==='mouse'&&e.button===1)?'pan':'rotate';last={x:e.clientX,y:e.clientY};if(e.button===1)e.preventDefault();}
  });
  stage.addEventListener('pointermove',function(e){
    if(!pts[e.pointerId])return;pts[e.pointerId]={x:e.clientX,y:e.clientY};
    if(mode==='touch2'&&Object.keys(pts).length>=2){var g=two();if(last.d>0){dist*=last.d/g.d;clampD();}pan(g.x-last.x,g.y-last.y);last=g;}
    else if(mode==='rotate'){var dx=e.clientX-last.x,dy=e.clientY-last.y;az-=dx*0.01;el=Math.max(-1.45,Math.min(1.45,el+dy*0.01));last={x:e.clientX,y:e.clientY};}
    else if(mode==='pan'){pan(e.clientX-last.x,e.clientY-last.y);last={x:e.clientX,y:e.clientY};}
  });
  function up(e){delete pts[e.pointerId];var k=Object.keys(pts);if(k.length===1){mode='rotate';last={x:pts[k[0]].x,y:pts[k[0]].y};}else if(!k.length){mode=null;}}
  stage.addEventListener('pointerup',up);stage.addEventListener('pointercancel',up);
  stage.addEventListener('wheel',function(e){e.preventDefault();dist*=1+Math.sign(e.deltaY)*0.08;clampD();},{passive:false});
  ['gesturestart','gesturechange','gestureend'].forEach(function(n){document.addEventListener(n,function(e){e.preventDefault();},{passive:false});});
  document.addEventListener('touchmove',function(e){if(e.target.closest&&e.target.closest('#stage'))e.preventDefault();},{passive:false});
  ren.domElement.addEventListener('webglcontextlost',function(e){e.preventDefault();});
  ren.domElement.addEventListener('webglcontextrestored',function(){location.reload();});
  function reset(){az=HOME.az;el=HOME.el;dist=homeDist();target.set(0,0,0);spin=true;clearTimeout(idle);hint.classList.remove('faded');}
  var lastTap=0,tapX=0,tapY=0,downT=0,moved=false;
  stage.addEventListener('pointerdown',function(e){downT=Date.now();moved=false;tapX=e.clientX;tapY=e.clientY;},true);
  stage.addEventListener('pointermove',function(e){if(Math.hypot(e.clientX-tapX,e.clientY-tapY)>10)moved=true;},true);
  stage.addEventListener('pointerup',function(e){if(moved||Date.now()-downT>300)return;var now=Date.now();if(now-lastTap<450){reset();lastTap=0;}else lastTap=now;},true);
  stage.addEventListener('dblclick',function(e){e.preventDefault();reset();});
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)spin=false;
  (function loop(){requestAnimationFrame(loop);if(spin)az+=0.006;
    cam.position.set(target.x+dist*Math.cos(el)*Math.sin(az),target.y+dist*Math.sin(el),target.z+dist*Math.cos(el)*Math.cos(az));
    cam.lookAt(target);cam.updateMatrixWorld();ren.render(scene,cam);})();
})();
